[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blt"
version = "0.1.0"
description = "Byte Latent Transformer (BLT): Patches Scale Better Than Tokens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff",
]
eval = [
    "tokenizers>=0.15.0",
    "tiktoken>=0.6.0",
    "rapidfuzz>=3.6.0",
    "sacrebleu>=2.4.0",
]
accel = [
    "numba>=0.58.0",
    "bitsandbytes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
