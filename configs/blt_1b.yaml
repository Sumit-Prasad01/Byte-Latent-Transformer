# BLT 1B parameter preset
# Reference: Pagnoni et al. (Dec 2024), Table 10

model_name: blt_1b
vocab_size: 260
context_length_bytes: 8192

local_encoder:
  layers: 1
  heads: 16
  hidden: 1024
  window_size: 512

latent_transformer:
  layers: 28
  heads: 16
  hidden: 2048
  grad_checkpointing: true

local_decoder:
  layers: 9
  heads: 16
  hidden: 1024
  window_size: 512

cross_attention:
  heads: 16
  k: 2

hash_ngrams:
  sizes: [3, 4, 5, 6, 7, 8]
  vocab_per_size: 500000

patching:
  type: entropy
  target_avg_patch_size: 4.5
  rule: monotonic
  context_reset: newline
